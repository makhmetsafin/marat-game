<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600&display=swap">
<title>Обычный рабочий день</title>
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --accent: #e8b84b;
    --accent2: #5b8dee;
    --text: #e8e4d9;
    --text-dim: #8a8a99;
    --green: #4ade80;
    --red: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    overflow-x: hidden;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }

  /* ── TITLE SCREEN ── */
  #title-screen {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  #title-screen::before {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    background: 
      radial-gradient(ellipse 80% 50% at 50% 60%, rgba(91,141,238,0.12) 0%, transparent 70%),
      repeating-linear-gradient(0deg, transparent, transparent 59px, rgba(255,255,255,0.02) 60px),
      repeating-linear-gradient(90deg, transparent, transparent 59px, rgba(255,255,255,0.02) 60px);
    pointer-events: none;
  }

  .title-logo {
    font-family: 'Tektur', monospace;
    font-size: clamp(2rem, 6vw, 4.5rem);
    font-weight: 900;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 0.3em;
    text-shadow: 0 0 60px rgba(232,184,75,0.4), 0 2px 0 rgba(0,0,0,0.5);
  }

  .title-sub {
    font-size: clamp(0.8rem, 2vw, 1rem);
    color: var(--text-dim);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-bottom: 3rem;
  }

  /* The corridor pseudo-3D scene for title */
  .title-scene {
    width: min(520px, 90vw);
    height: 280px;
    position: relative;
    margin-bottom: 2.5rem;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
  }
  #title-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ── GAME WRAPPER ── */
  #game {
    display: none;
    -webkit-flex-direction: column;
    flex-direction: column;
    width: 100%;
    min-height: 100vh;
    min-height: -webkit-fill-available;
    max-width: 860px;
    margin: 0 auto;
    padding: 1rem;
  }

  /* HUD */
  .hud {
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-align-items: center;
    align-items: center;
    padding: 0.6rem 1rem;
    background: rgba(17,24,39,0.9);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 4px;
    margin-bottom: 1rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .hud-time {
    font-family: 'Tektur', monospace;
    font-size: 1rem;
    color: var(--accent);
    font-weight: 700;
  }

  .stat-bar {
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    gap: 0.4rem;
  }

  .stat-fill {
    height: 6px;
    width: 80px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }

  .stat-pct {
    font-family: 'Tektur', monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    min-width: 2.4rem;
    text-align: right;
  }

  .stat-delta {
    font-family: 'Tektur', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    min-width: 2.8rem;
    opacity: 0;
    transition: opacity 0.2s ease;
    white-space: nowrap;
  }
  .stat-delta.pos { color: #4ade80; }
  .stat-delta.neg { color: #f87171; }
  .stat-delta.visible { opacity: 1; }

  .stat-fill-inner {
    height: 100%;
    border-radius: 3px;
    -webkit-transition: width 0.6s ease;
    transition: width 0.6s ease;
  }

  .stat-respect .stat-fill-inner { background: var(--accent2); }
  .stat-calm .stat-fill-inner { background: var(--green); }

  /* ── SCENE PANEL ── */
  .scene-panel {
    position: relative;
    width: 100%;
    height: clamp(220px, 38vw, 340px);
    background: var(--surface);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 0;
    border: 1px solid rgba(255,255,255,0.06);
  }

  /* Canvas for pseudo-3D */
  .scene-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Location label */
  .location-label {
    position: absolute;
    top: 0.8rem;
    left: 0.8rem;
    background: rgba(10,14,26,0.85);
    border: 1px solid rgba(232,184,75,0.3);
    color: var(--accent);
    font-family: 'Tektur', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.25rem 0.6rem;
    border-radius: 2px;
  }

  /* ── NARRATIVE BOX ── */
  .narrative-box {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.06);
    border-top: none;
    padding: 1rem 1.2rem;
    min-height: 80px;
    position: relative;
  }

  .narrative-speaker {
    font-family: 'Tektur', monospace;
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .narrative-text {
    font-size: 0.88rem;
    line-height: 1.6;
    color: var(--text);
  }

  .narrative-text .highlight {
    color: var(--accent);
    font-weight: 600;
  }

  /* Stat change notification */
  .stat-popup {
    position: absolute;
    right: 1rem;
    top: 0.7rem;
    font-family: 'Tektur', monospace;
    font-size: 0.75rem;
    color: var(--green);
    opacity: 0;
    transform: translateY(0);
    pointer-events: none;
  }

  .stat-popup.show {
    animation: popUp 2s ease forwards;
  }

  @keyframes popUp {
    0% { opacity: 0; transform: translateY(8px); }
    20% { opacity: 1; transform: translateY(0); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-10px); }
  }

  /* ── PHONE MESSAGES ── */
  .phone-overlay {
    display: none;
    position: fixed;
    bottom: 6rem;
    bottom: calc(6rem + env(safe-area-inset-bottom));
    right: 1rem;
    width: 220px;
    background: #1c1c1e;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.12);
    padding: 0.8rem;
    z-index: 100;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: slideInPhone 0.3s ease;
  }

  @keyframes slideInPhone {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .phone-overlay.show { display: block; }

  .phone-header {
    font-size: 0.6rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    padding-bottom: 0.4rem;
  }

  .phone-msg {
    font-size: 0.75rem;
    color: var(--text);
    padding: 0.3rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    line-height: 1.4;
  }

  .phone-msg:last-child { border-bottom: none; }

  .phone-sender {
    font-size: 0.65rem;
    color: var(--accent2);
    font-weight: 600;
  }

  /* ── CHOICES ── */
  .choices-area {
    margin-top: 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .choices-label {
    font-size: 0.65rem;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 0.2rem;
  }

  .choice-btn {
    -webkit-tap-highlight-color: transparent;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    gap: 0.8rem;
    padding: 0.75rem 1rem;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
    -webkit-transition: all 0.18s ease;
    transition: all 0.18s ease;
    text-align: left;
    position: relative;
    overflow: hidden;
  }

  .choice-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform 0.18s ease;
  }

  .choice-btn:hover {
    background: var(--surface2);
    border-color: rgba(232,184,75,0.3);
    transform: translateX(3px);
  }

  .choice-btn:hover::before { transform: scaleY(1); }

  .choice-arrow {
    font-family: 'Tektur', monospace;
    font-size: 1rem;
    color: var(--accent);
    min-width: 1.5rem;
    text-align: center;
  }

  /* Navigation arrows - big directional buttons */
  .nav-arrows {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 0.4rem;
    margin-top: 0.8rem;
    max-width: 280px;
    margin-left: auto;
    margin-right: auto;
  }

  .nav-btn {
    -webkit-tap-highlight-color: transparent;
    padding: 0.6rem;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    color: var(--text);
    font-family: 'Tektur', monospace;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: center;
    line-height: 1.2;
  }

  .nav-btn:hover {
    background: var(--surface2);
    border-color: rgba(232,184,75,0.4);
    color: var(--accent);
  }

  .nav-btn.up { grid-column: 2; }
  .nav-btn.left { grid-column: 1; grid-row: 2; }
  .nav-btn.center { grid-column: 2; grid-row: 2; font-size: 0.65rem; }
  .nav-btn.right { grid-column: 3; grid-row: 2; }
  .nav-btn.disabled { opacity: 0.2; pointer-events: none; }

  /* Emoji as nav icons */
  .nav-icon { font-size: 1.2rem; display: block; }
  .nav-label { font-size: 0.6rem; color: var(--text-dim); letter-spacing: 0.05em; }

  /* ── MINI SCENE - phone notification badge ── */
  .phone-badge {
    position: fixed;
    bottom: 1rem;
    bottom: calc(1rem + env(safe-area-inset-bottom));
    right: 1rem;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
    background: var(--accent);
    color: var(--bg);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    cursor: pointer;
    z-index: 101;
    box-shadow: 0 4px 20px rgba(232,184,75,0.4);
    transition: transform 0.15s ease;
  }

  .phone-badge:hover { transform: scale(1.1); }

  .phone-badge .notif {
    position: absolute;
    top: -4px; right: -4px;
    background: #ef4444;
    color: white;
    width: 18px; height: 18px;
    border-radius: 50%;
    font-size: 0.6rem;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Tektur', monospace;
    font-weight: 700;
  }

  /* ── START BUTTON ── */
  .start-btn {
    padding: 0.9rem 2.5rem;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 3px;
    font-family: 'Tektur', monospace;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-transition: all 0.18s ease;
    transition: all 0.18s ease;
    box-shadow: 0 6px 30px rgba(232,184,75,0.3);
  }

  .start-btn:hover {
    background: #f0ca6e;
    transform: translateY(-2px);
    box-shadow: 0 10px 40px rgba(232,184,75,0.45);
  }

  /* ── SCENE TRANSITIONS ── */
  .scene-panel, .narrative-box {
    -webkit-transition: opacity 0.25s ease;
    transition: opacity 0.25s ease;
    will-change: opacity;
  }

  .fading { opacity: 0 !important; }

  /* Canvas rendering — pixelated not supported in Safari, omitted */

  /* Final screen */
  #final-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 2rem;
    gap: 1.5rem;
  }

  .final-title {
    font-family: 'Tektur', monospace;
    font-size: clamp(1.5rem, 5vw, 3rem);
    color: var(--accent);
    font-weight: 900;
  }

  .final-quote {
    font-size: clamp(0.9rem, 2.5vw, 1.2rem);
    color: var(--text);
    max-width: 500px;
    line-height: 1.8;
    font-style: italic;
  }

  .final-stats {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .final-stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
  }

  .final-stat-val {
    font-family: 'Tektur', monospace;
    font-size: 2rem;
    font-weight: 900;
    color: var(--accent);
  }

  .final-stat-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .restart-btn {
    padding: 0.7rem 2rem;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 3px;
    font-family: 'Tektur', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .restart-btn:hover {
    background: var(--accent);
    color: var(--bg);
  }

  /* toast for mini events */
  .toast {
    position: fixed;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%) translateY(-60px);
    background: var(--surface2);
    border: 1px solid rgba(232,184,75,0.3);
    color: var(--text);
    padding: 0.6rem 1.2rem;
    border-radius: 4px;
    font-size: 0.8rem;
    z-index: 200;
    transition: transform 0.3s ease;
    white-space: nowrap;
    max-width: 90vw;
    text-align: center;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* chapter title overlay */
  .chapter-title {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: center;
    justify-content: center;
    background: rgba(10,14,26,0.92);
    z-index: 300;
    opacity: 0;
    pointer-events: none;
    -webkit-transition: opacity 0.4s ease;
    transition: opacity 0.4s ease;
  }

  .chapter-title.show {
    opacity: 1;
    pointer-events: auto;
  }

  .chapter-num {
    font-size: 0.7rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
  }

  .chapter-name {
    font-family: 'Tektur', monospace;
    font-size: clamp(1.5rem, 5vw, 3.5rem);
    color: var(--accent);
    font-weight: 900;
    text-align: center;
  }

  @media (max-width: 500px) {
    .hud { font-size: 0.65rem; }
    .stat-fill { width: 50px; }
    .choice-btn { font-size: 0.78rem; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════ TITLE SCREEN ═══════════════════════════════ -->
<div id="title-screen">
  <div class="title-logo">Обычный<br>рабочий день</div>
  <div class="title-sub">Офисная бродилка · Банк</div>

  <div class="title-scene">
    <canvas id="title-canvas" class="scene-canvas" width="520" height="280"></canvas>
  </div>

  <button class="start-btn" id="start-btn">▶ НАЧАТЬ ИГРУ</button>
</div>

<!-- ═══════════════════════════════ GAME ═══════════════════════════════ -->
<div id="game">

  <!-- HUD -->
  <div class="hud">
    <div class="hud-time" id="game-time">07:58</div>
    <div class="stat-bar stat-respect">
      <span>Уважение</span>
      <div class="stat-fill"><div class="stat-fill-inner" id="bar-respect" style="width:50%"></div></div>
      <span class="stat-pct" id="pct-respect">50%</span>
      <span class="stat-delta" id="delta-respect"></span>
    </div>
    <div class="stat-bar stat-calm">
      <span>Спокойствие</span>
      <div class="stat-fill"><div class="stat-fill-inner" id="bar-calm" style="width:60%"></div></div>
      <span class="stat-pct" id="pct-calm">60%</span>
      <span class="stat-delta" id="delta-calm"></span>
    </div>
    <div style="font-size:0.7rem">🎂 <span id="chapter-label">Утро</span></div>
  </div>

  <!-- Scene -->
  <div class="scene-panel" id="scene-panel">
    <canvas id="game-canvas" class="scene-canvas"></canvas>
    <img id="scene-photo" src="" alt="" style="display:none;position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center top;">
    <div class="location-label" id="location-label">ХОЛЛ БАНКА</div>
    <div class="stat-popup" id="stat-popup"></div>
  </div>

  <!-- Narrative -->
  <div class="narrative-box" id="narrative-box">
    <div class="narrative-speaker" id="narrative-speaker"></div>
    <div class="narrative-text" id="narrative-text"></div>
  </div>

  <!-- Navigation arrows -->
  <div class="nav-arrows" id="nav-arrows" style="display:none">
    <button class="nav-btn up disabled" id="nav-up">
      <span class="nav-icon">↑</span>
      <span class="nav-label" id="nav-up-label">Вперёд</span>
    </button>
    <button class="nav-btn left disabled" id="nav-left">
      <span class="nav-icon">←</span>
      <span class="nav-label" id="nav-left-label">Влево</span>
    </button>
    <button class="nav-btn center disabled" id="nav-center">
      <span class="nav-icon">●</span>
      <span class="nav-label">Действие</span>
    </button>
    <button class="nav-btn right disabled" id="nav-right">
      <span class="nav-icon">→</span>
      <span class="nav-label" id="nav-right-label">Вправо</span>
    </button>
  </div>

  <!-- Choice buttons area -->
  <div class="choices-area" id="choices-area"></div>

</div>

<!-- ═══════════════════════════════ FINAL SCREEN ═══════════════════════════════ -->
<div id="final-screen">
  <div class="final-title">С днём рождения,<br>Марат!</div>
  <div class="final-quote" id="final-quote">"Наверное, ради этого всё и работает."</div>
  <div class="final-stats">
    <div class="final-stat">
      <div class="final-stat-val" id="fs-respect">—</div>
      <div class="final-stat-label">Уважение</div>
    </div>
    <div class="final-stat">
      <div class="final-stat-val" id="fs-calm">—</div>
      <div class="final-stat-label">Спокойствие</div>
    </div>
    <div class="final-stat">
      <div class="final-stat-val" id="fs-choices">—</div>
      <div class="final-stat-label">Решений принято</div>
    </div>
  </div>
  <button class="restart-btn" onclick="location.reload()">↺ СЫГРАТЬ ЕЩЁ РАЗ</button>
</div>

<!-- Phone overlay -->
<div class="phone-overlay" id="phone-overlay">
  <div class="phone-header">📱 Входящие сообщения</div>
  <div id="phone-msgs"></div>
</div>

<!-- Phone badge -->
<div class="phone-badge" id="phone-badge" style="display:none" onclick="togglePhone()">
  📱
  <div class="notif" id="phone-notif">5</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Chapter title overlay -->
<div class="chapter-title" id="chapter-overlay">
  <div class="chapter-num" id="chapter-num-text">ГЛАВА 1</div>

function drawScene(canvasId, scene, animFrame) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  // offsetWidth may be 0 on Safari before first layout — fallback to parent or CSS value
  // Размер из offsetWidth; если 0 — берём из getBoundingClientRect (точнее в Safari)
  let cssW = canvas.offsetWidth;
  let cssH = canvas.offsetHeight;
  if (!cssW || !cssH) {
    const r = canvas.getBoundingClientRect();
    cssW = r.width || (canvas.parentElement && canvas.parentElement.offsetWidth) || 520;
    cssH = r.height || (canvas.parentElement && canvas.parentElement.offsetHeight) || 280;
  }
  if (cssW < 2 || cssH < 2) return; // ещё не разложен
  if (canvas.width !== cssW || canvas.height !== cssH) {
    canvas.width = cssW;
    canvas.height = cssH;
  }
  const W = canvas.width;
  const H = canvas.height;

  ctx.clearRect(0, 0, W, H);

  const scenes = {
    title: drawCorridor,
    hall: drawHall,
    canteen: drawCanteen,
    elevator: drawElevator,
    office: drawOffice,
    toilet: drawToilet,
    meeting: drawMeeting,
    krrb: drawKRRB,
    evening: drawEvening,
  };

  (scenes[scene] || drawCorridor)(ctx, W, H, animFrame);
  drawMarat(ctx, W, H, animFrame);
}

// ── HELPERS
function noise(x, y, s) { return (Math.sin(x * 127.1 + y * 311.7) * 43758.5453) % 1; }

function drawMarbleFloor(ctx, W, H, y0, y1, col1, col2) {
  for (let y = y0; y < y1; y += 2) {
    const t2 = (y - y0) / (y1 - y0);
    const g = ctx.createLinearGradient(0, y, W, y);
    g.addColorStop(0, col1);
    g.addColorStop(0.3 + 0.4 * Math.sin(y * 0.07), col2);
    g.addColorStop(0.6 + 0.2 * Math.cos(y * 0.11), col1);
    g.addColorStop(1, col2);
    ctx.fillStyle = g;
    ctx.globalAlpha = 0.9 - t2 * 0.3;
    ctx.fillRect(0, y, W, 2);
  }
  ctx.globalAlpha = 1;
}

function drawVeinLines(ctx, W, H, y0, y1, baseAlpha) {
  for (let i = 0; i < 8; i++) {
    const sx = Math.sin(i * 17.3) * W;
    const ex = (Math.cos(i * 9.7) * 0.5 + 0.5) * W;
    ctx.beginPath();
    ctx.moveTo(sx, y0);
    ctx.bezierCurveTo(sx + 30, y0 + (y1 - y0) * 0.3, ex - 20, y0 + (y1 - y0) * 0.7, ex, y1);
    ctx.strokeStyle = `rgba(255,255,255,${baseAlpha * (0.3 + Math.sin(i) * 0.2)})`;
    ctx.lineWidth = 0.5;
    ctx.stroke();
  }
}

function perspRect(ctx, vx, vy, scale, x0, y0, w, h, fillStyle) {
  const project = (px, py) => ({
    x: vx + (px - vx) * scale,
    y: vy + (py - vy) * scale
  });
  const tl = project(x0, y0), tr = project(x0 + w, y0);
  const bl = project(x0, y0 + h), br = project(x0 + w, y0 + h);
  ctx.beginPath();
  ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y);
  ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y);
  ctx.closePath();
  ctx.fillStyle = fillStyle;
  ctx.fill();
}

function drawCorridor(ctx, W, H, t) {
  const vx = W / 2, vy = H * 0.43;

  // Ceiling
  const ceil = ctx.createLinearGradient(0, 0, 0, vy);
  ceil.addColorStop(0, '#c8c0b0');
  ceil.addColorStop(0.6, '#e0d8cc');
  ceil.addColorStop(1, '#b8b0a0');
  ctx.fillStyle = ceil;
  ctx.fillRect(0, 0, W, vy);

  // Floor — marble
  const floorG = ctx.createLinearGradient(0, vy, 0, H);
  floorG.addColorStop(0, '#d4cfc8');
  floorG.addColorStop(0.3, '#e8e4de');
  floorG.addColorStop(0.7, '#d0cbc4');
  floorG.addColorStop(1, '#b8b4ae');
  ctx.fillStyle = floorG;
  ctx.fillRect(0, vy, W, H - vy);
  drawVeinLines(ctx, W, H, vy, H, 0.06);

  // Walls
  const leftWall = ctx.createLinearGradient(0, 0, W * 0.38, 0);
  leftWall.addColorStop(0, '#8a8070');
  leftWall.addColorStop(1, '#c0b8a8');
  ctx.fillStyle = leftWall;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(W * 0.38, vy * 0.15);
  ctx.lineTo(W * 0.38, vy + H * 0.15); ctx.lineTo(0, H);
  ctx.closePath(); ctx.fill();

  const rightWall = ctx.createLinearGradient(W * 0.62, 0, W, 0);
  rightWall.addColorStop(0, '#c0b8a8');
  rightWall.addColorStop(1, '#8a8070');
  ctx.fillStyle = rightWall;
  ctx.beginPath();
  ctx.moveTo(W, 0); ctx.lineTo(W * 0.62, vy * 0.15);
  ctx.lineTo(W * 0.62, vy + H * 0.15); ctx.lineTo(W, H);
  ctx.closePath(); ctx.fill();

  // Back wall
  const backW = ctx.createLinearGradient(0, 0, 0, H);
  backW.addColorStop(0, '#e8e0d4');
  backW.addColorStop(1, '#c4bdb0');
  ctx.fillStyle = backW;
  ctx.beginPath();
  ctx.moveTo(W * 0.38, vy * 0.15);
  ctx.lineTo(W * 0.62, vy * 0.15);
  ctx.lineTo(W * 0.62, vy + H * 0.15);
  ctx.lineTo(W * 0.38, vy + H * 0.15);
  ctx.closePath(); ctx.fill();

  // Ceiling panels perspective
  for (let i = 1; i <= 4; i++) {
    const f = i / 4;
    const pw = W * (1 - f * 0.5);
    const px = (W - pw) / 2;
    const py = f * vy * 0.85;
    ctx.strokeStyle = `rgba(160,150,140,${0.4 * f})`;
    ctx.lineWidth = 0.5;
    ctx.strokeRect(px, 0, pw, py);
  }

  // Floor tiles perspective
  for (let i = 1; i <= 5; i++) {
    const f = i / 5;
    const ty = vy + f * (H - vy) * 0.95;
    const tx1 = vx - f * W * 0.5;
    const tx2 = vx + f * W * 0.5;
    ctx.strokeStyle = `rgba(180,170,160,${0.35})`;
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(tx1, ty); ctx.lineTo(tx2, ty); ctx.stroke();
    // vertical grout lines
    ctx.beginPath(); ctx.moveTo(vx - f * W * 0.25, vy); ctx.lineTo(tx1, ty); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(vx + f * W * 0.25, vy); ctx.lineTo(tx2, ty); ctx.stroke();
  }

  // Overhead recessed lights
  for (let i = 0; i < 4; i++) {
    const f = (i + 1) / 4.5;
    const lx = vx;
    const ly = f * vy * 0.9;
    const pulse = 0.85 + 0.15 * Math.sin(t * 0.03 + i * 1.3);
    const radius = 18 * f * pulse;
    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, radius * 3.5);
    lg.addColorStop(0, `rgba(255,248,230,${0.9 * f * pulse})`);
    lg.addColorStop(0.15, `rgba(255,245,210,${0.5 * f * pulse})`);
    lg.addColorStop(0.5, `rgba(255,240,200,${0.12 * f})`);
    lg.addColorStop(1, 'transparent');
    ctx.fillStyle = lg;
    ctx.fillRect(lx - radius * 3, ly - radius, radius * 6, radius * 6);
    // Fixture housing
    ctx.fillStyle = `rgba(240,235,225,${0.95 * f})`;
    ctx.fillRect(lx - 10 * f, ly - 2, 20 * f, 4);
  }

  // Wall sconces
  const sconceX = [W * 0.15, W * 0.85];
  sconceX.forEach(sx => {
    const sg = ctx.createRadialGradient(sx, H * 0.35, 0, sx, H * 0.35, 40);
    sg.addColorStop(0, `rgba(255,220,150,${0.3 + 0.1 * Math.sin(t * 0.04)})`);
    sg.addColorStop(1, 'transparent');
    ctx.fillStyle = sg;
    ctx.fillRect(sx - 40, H * 0.15, 80, 80);
    ctx.fillStyle = 'rgba(200,180,140,0.6)';
    ctx.fillRect(sx - 4, H * 0.25, 8, 20);
  });

  // Subtle ambient on floor (light pools)
  const floorLight = ctx.createRadialGradient(vx, H, 0, vx, H, W * 0.4);
  floorLight.addColorStop(0, 'rgba(255,248,230,0.12)');
  floorLight.addColorStop(1, 'transparent');
  ctx.fillStyle = floorLight;
  ctx.fillRect(0, vy, W, H - vy);
}

function drawHall(ctx, W, H, t) {
  drawCorridor(ctx, W, H, t);
  const vx = W / 2, vy = H * 0.43;

  // Grand reception counter in back
  const cw = W * 0.28, cy = vy + H * 0.04;
  const counterG = ctx.createLinearGradient(vx - cw / 2, 0, vx + cw / 2, 0);
  counterG.addColorStop(0, '#7a6a50');
  counterG.addColorStop(0.5, '#a89070');
  counterG.addColorStop(1, '#7a6a50');
  ctx.fillStyle = counterG;
  ctx.fillRect(vx - cw / 2, cy, cw, H * 0.07);
  // Counter top marble
  ctx.fillStyle = 'rgba(240,235,225,0.9)';
  ctx.fillRect(vx - cw / 2 - 3, cy - 3, cw + 6, 5);

  // Turnstiles — metal chrome
  const turnPos = [W * 0.22, W * 0.40, W * 0.60, W * 0.78];
  turnPos.forEach((tx, i) => {
    const th = H * 0.38;
    const ty = H * 0.52;
    // Post
    const tg = ctx.createLinearGradient(tx - 4, 0, tx + 4, 0);
    tg.addColorStop(0, '#888');
    tg.addColorStop(0.4, '#ddd');
    tg.addColorStop(0.7, '#bbb');
    tg.addColorStop(1, '#888');
    ctx.fillStyle = tg;
    ctx.fillRect(tx - 4, ty, 8, th);
    // Arm
    ctx.fillStyle = 'rgba(200,200,200,0.7)';
    ctx.fillRect(tx - 18, ty + 12, 36, 3);
    // Glass panel between pairs
    if (i % 2 === 0) {
      const gPanel = ctx.createLinearGradient(tx, 0, tx + W * 0.18, 0);
      gPanel.addColorStop(0, 'rgba(180,210,240,0.08)');
      gPanel.addColorStop(0.5, 'rgba(180,210,240,0.18)');
      gPanel.addColorStop(1, 'rgba(180,210,240,0.06)');
      ctx.fillStyle = gPanel;
      ctx.fillRect(tx, ty, W * 0.18, th);
    }
  });

  // Logo on back wall — embossed effect
  const vx2 = vx, vy2 = vy - H * 0.08;
  ctx.save();
  ctx.font = `bold ${Math.floor(W * 0.045)}px Georgia, serif`;
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(120,100,70,0.8)';
  ctx.fillText('БАНК', vx2 + 1, vy2 + 1);
  ctx.fillStyle = 'rgba(232,200,140,0.95)';
  ctx.fillText('БАНК', vx2, vy2);
  ctx.restore();

  // Decorative column bases
  [[W * 0.12, H * 0.45], [W * 0.88, H * 0.45]].forEach(([cx, cy2]) => {
    const colG = ctx.createLinearGradient(cx - 12, 0, cx + 12, 0);
    colG.addColorStop(0, '#7a7060'); colG.addColorStop(0.5, '#c8bca8'); colG.addColorStop(1, '#7a7060');
    ctx.fillStyle = colG;
    ctx.fillRect(cx - 12, cy2, 24, H - cy2);
    ctx.fillStyle = 'rgba(220,215,205,0.9)';
    ctx.fillRect(cx - 14, cy2 - 4, 28, 6);
  });

  // People silhouettes walking
  const pTime = t * 0.5;
  [0.3, 0.7].forEach((px, i) => {
    const walkX = W * px + Math.sin(pTime * 0.02 + i * 2) * 8;
    const walkY = H * 0.68 + Math.sin(pTime * 0.03 + i) * 2;
    drawSilhouette(ctx, walkX, walkY, 0.7 + i * 0.1, t + i * 30);
  });
}

function drawSilhouette(ctx, x, y, scale, t) {
  const h = 55 * scale;
  ctx.fillStyle = 'rgba(80,70,60,0.45)';
  // Body
  ctx.beginPath();
  ctx.ellipse(x, y - h * 0.55, 8 * scale, 18 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  // Head
  ctx.beginPath();
  ctx.arc(x, y - h * 0.88, 8 * scale, 0, Math.PI * 2);
  ctx.fill();
  // Legs
  const legSwing = Math.sin(t * 0.08) * 5;
  ctx.fillRect(x - 6 * scale + legSwing, y - h * 0.38, 5 * scale, h * 0.38);
  ctx.fillRect(x + 1 * scale - legSwing, y - h * 0.38, 5 * scale, h * 0.38);
}

function drawCanteen(ctx, W, H, t) {
  // Warm morning light from large windows right side
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#c8bca0');
  bg.addColorStop(0.6, '#d8cdb0');
  bg.addColorStop(1, '#e8d8b8');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Floor — warm wood
  const floorY = H * 0.58;
  for (let y = floorY; y < H; y += 14) {
    const shade = 0.5 + 0.5 * Math.sin(y * 0.4);
    ctx.fillStyle = `rgba(${120 + shade * 30},${85 + shade * 20},${50 + shade * 15},0.9)`;
    ctx.fillRect(0, y, W, 13);
    // Plank lines
    ctx.strokeStyle = 'rgba(80,50,30,0.2)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < W; x += W * 0.25 + shade * 20) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 13); ctx.stroke();
    }
  }

  // Ceiling
  ctx.fillStyle = '#f0e8d8';
  ctx.fillRect(0, 0, W, H * 0.1);

  // Back wall with windows — warm sunlight
  const wallG = ctx.createLinearGradient(0, 0, W, 0);
  wallG.addColorStop(0, '#c8b898');
  wallG.addColorStop(0.5, '#e0d0b0');
  wallG.addColorStop(1, '#f8e8c8');
  ctx.fillStyle = wallG;
  ctx.fillRect(0, H * 0.1, W, floorY - H * 0.1);

  // Windows with morning sun
  const winPositions = [W * 0.6, W * 0.78];
  winPositions.forEach(wx => {
    const ww = W * 0.15, wh = H * 0.35;
    const wy = H * 0.12;
    // Frame
    ctx.fillStyle = '#a89070';
    ctx.fillRect(wx - 2, wy - 2, ww + 4, wh + 4);
    // Sky/outside
    const skyG = ctx.createLinearGradient(0, wy, 0, wy + wh);
    skyG.addColorStop(0, '#d4e8f8');
    skyG.addColorStop(1, '#e8f4fc');
    ctx.fillStyle = skyG;
    ctx.fillRect(wx, wy, ww, wh);
    // Cross bars
    ctx.fillStyle = '#a89070';
    ctx.fillRect(wx, wy + wh * 0.5 - 1, ww, 2);
    ctx.fillRect(wx + ww * 0.5 - 1, wy, 2, wh);
    // Sun flare
    const flare = ctx.createRadialGradient(wx + ww * 0.7, wy + wh * 0.2, 0, wx + ww * 0.7, wy + wh * 0.2, ww * 0.8);
    flare.addColorStop(0, `rgba(255,245,200,${0.6 + 0.1 * Math.sin(t * 0.02)})`);
    flare.addColorStop(0.5, `rgba(255,235,150,0.2)`);
    flare.addColorStop(1, 'transparent');
    ctx.fillStyle = flare;
    ctx.fillRect(wx, wy, ww, wh);
    // Light shaft on floor
    ctx.save();
    ctx.globalAlpha = 0.12 + 0.03 * Math.sin(t * 0.02);
    const shaft = ctx.createLinearGradient(wx, wy + wh, wx + ww * 0.5, H);
    shaft.addColorStop(0, 'rgba(255,240,180,1)');
    shaft.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.beginPath();
    ctx.moveTo(wx, wy + wh); ctx.lineTo(wx + ww, wy + wh);
    ctx.lineTo(wx + ww * 1.4, H); ctx.lineTo(wx - ww * 0.2, H);
    ctx.closePath();
    ctx.fillStyle = shaft;
    ctx.fill();
    ctx.restore();
  });

  // Tables — round cafe style
  const tableData = [
    { x: W * 0.18, y: H * 0.55, r: 28 },
    { x: W * 0.42, y: H * 0.52, r: 32 },
    { x: W * 0.65, y: H * 0.6, r: 24 },
  ];
  tableData.forEach(td => {
    // Table shadow
    const shG = ctx.createRadialGradient(td.x, td.y + 3, 0, td.x, td.y + 5, td.r * 1.2);
    shG.addColorStop(0, 'rgba(0,0,0,0.2)');
    shG.addColorStop(1, 'transparent');
    ctx.fillStyle = shG;
    ctx.beginPath(); ctx.ellipse(td.x, td.y + 5, td.r, td.r * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    // Tabletop
    const tg = ctx.createRadialGradient(td.x - td.r * 0.2, td.y - td.r * 0.15, 0, td.x, td.y, td.r);
    tg.addColorStop(0, '#f0e8d8'); tg.addColorStop(1, '#c8b898');
    ctx.fillStyle = tg;
    ctx.beginPath(); ctx.ellipse(td.x, td.y, td.r, td.r * 0.28, 0, 0, Math.PI * 2); ctx.fill();
    // Cup on table
    ctx.fillStyle = '#8a6040';
    ctx.fillRect(td.x - 4, td.y - 14, 8, 11);
    // Steam
    for (let s = 0; s < 2; s++) {
      const sw = Math.sin(t * 0.05 + s * 2) * 3;
      ctx.strokeStyle = `rgba(200,200,200,${0.25 + 0.15 * Math.sin(t * 0.04 + s)})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(td.x - 2 + s * 4 + sw, td.y - 14);
      ctx.bezierCurveTo(td.x - 2 + s * 4 - sw, td.y - 20, td.x + 2 + s * 4 + sw, td.y - 24, td.x + s * 2 + sw * 0.5, td.y - 29);
      ctx.stroke();
    }
    // Leg
    ctx.fillStyle = '#8a7860';
    ctx.fillRect(td.x - 2, td.y, 4, floorY - td.y);
  });

  // Chairs
  [[W * 0.12, H * 0.63], [W * 0.24, H * 0.63], [W * 0.38, H * 0.62], [W * 0.48, H * 0.60]].forEach(([cx, cy]) => {
    ctx.fillStyle = '#7a6a50';
    ctx.fillRect(cx - 10, cy, 20, 3);
    ctx.fillRect(cx - 10, cy - 18, 20, 18);
    ctx.fillStyle = '#c8b898';
    ctx.fillRect(cx - 10, cy - 18, 20, 18);
  });

  // Person at table (Kozyrevo silhouette)
  ctx.fillStyle = 'rgba(60,45,30,0.6)';
  ctx.beginPath(); ctx.arc(W * 0.42, H * 0.42, 14, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(W * 0.42 - 14, H * 0.42, 28, 20);
  // Wave gesture
  ctx.save();
  ctx.translate(W * 0.42 + 16, H * 0.48);
  ctx.rotate(Math.sin(t * 0.06) * 0.3);
  ctx.fillStyle = 'rgba(60,45,30,0.55)';
  ctx.fillRect(0, -12, 7, 18);
  ctx.restore();

  // Coffee counter hint
  const counterG2 = ctx.createLinearGradient(0, H * 0.35, 0, H * 0.55);
  counterG2.addColorStop(0, '#6a5840');
  counterG2.addColorStop(1, '#8a7050');
  ctx.fillStyle = counterG2;
  ctx.fillRect(0, H * 0.38, W * 0.06, H * 0.2);
}

function drawElevator(ctx, W, H, t) {
  // Marble lobby wall behind
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#c0b8a8');
  bg.addColorStop(1, '#a89880');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  drawVeinLines(ctx, W, H, 0, H, 0.04);

  const floorY = H * 0.8;
  // Floor
  const flG = ctx.createLinearGradient(0, floorY, 0, H);
  flG.addColorStop(0, '#d0c8b8'); flG.addColorStop(1, '#b8b0a0');
  ctx.fillStyle = flG;
  ctx.fillRect(0, floorY, W, H - floorY);

  // Elevator doors — brushed steel
  const doorW = W * 0.36, doorH = H * 0.82, doorTop = H * 0.06;
  const doorPositions = [W * 0.08, W * 0.56];
  doorPositions.forEach((dx, di) => {
    // Frame
    ctx.fillStyle = '#6a6050';
    ctx.fillRect(dx - 4, doorTop - 4, doorW + 8, doorH + 8);
    // Door panel — brushed metal
    for (let x = dx; x < dx + doorW; x += 2) {
      const shade = (Math.sin(x * 0.15) * 0.5 + 0.5);
      ctx.fillStyle = `rgb(${170 + shade * 30},${175 + shade * 25},${180 + shade * 20})`;
      ctx.fillRect(x, doorTop, 2, doorH);
    }
    // Vertical brushed lines
    for (let i = 0; i < 12; i++) {
      ctx.strokeStyle = `rgba(255,255,255,${0.06 + 0.04 * Math.sin(i * 2.1)})`;
      ctx.lineWidth = 0.5;
      const lx = dx + i * (doorW / 12);
      ctx.beginPath(); ctx.moveTo(lx, doorTop); ctx.lineTo(lx, doorTop + doorH); ctx.stroke();
    }
    // Gap glow down center of pair
    if (di === 0) {
      const gapX = dx + doorW;
      const gapGlow = ctx.createLinearGradient(gapX - 10, 0, gapX + 10, 0);
      gapGlow.addColorStop(0, 'transparent');
      gapGlow.addColorStop(0.5, `rgba(255,245,210,${0.35 + 0.1 * Math.sin(t * 0.025)})`);
      gapGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = gapGlow;
      ctx.fillRect(gapX - 10, doorTop, 20, doorH);
      // Gap line
      ctx.fillStyle = `rgba(50,40,30,0.8)`;
      ctx.fillRect(gapX - 1, doorTop, 2, doorH);
    }
    // Door number indicator — digital display
    const indX = dx + doorW * 0.5, indY = doorTop - 18;
    ctx.fillStyle = '#1a1812';
    ctx.fillRect(indX - 16, indY - 8, 32, 16);
    ctx.fillStyle = `rgba(232,184,75,${0.8 + 0.15 * Math.sin(t * 0.03 + di)})`;
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    const floor = Math.floor(((t + di * 60) * 0.008) % 12) + 1;
    ctx.fillText(floor + (di === 0 ? '↑' : '↓'), indX, indY + 4);
  });

  // Call button panel
  const btnPanelX = W * 0.46, btnPanelY = H * 0.35;
  ctx.fillStyle = '#8a8070';
  ctx.fillRect(btnPanelX, btnPanelY, 18, 50);
  [0, 28].forEach((yo, i) => {
    const lit = Math.sin(t * 0.04 + i * Math.PI) > 0.3;
    ctx.fillStyle = lit ? `rgba(232,184,75,0.9)` : '#3a3020';
    ctx.beginPath();
    ctx.arc(btnPanelX + 9, btnPanelY + 11 + yo, 7, 0, Math.PI * 2);
    ctx.fill();
    if (lit) {
      const btnG = ctx.createRadialGradient(btnPanelX + 9, btnPanelY + 11 + yo, 0, btnPanelX + 9, btnPanelY + 11 + yo, 14);
      btnG.addColorStop(0, 'rgba(255,220,100,0.3)');
      btnG.addColorStop(1, 'transparent');
      ctx.fillStyle = btnG;
      ctx.fillRect(btnPanelX - 5, btnPanelY + yo, 28, 22);
    }
    ctx.fillStyle = '#c8b890';
    ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(i === 0 ? '▲' : '▼', btnPanelX + 9, btnPanelY + 14 + yo);
  });

  // Reflection on shiny floor
  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.scale(1, -0.3);
  ctx.translate(0, -H * 1.6 / 0.3);
  doorPositions.forEach(dx => {
    for (let x = dx; x < dx + doorW; x += 2) {
      const shade = (Math.sin(x * 0.15) * 0.5 + 0.5);
      ctx.fillStyle = `rgb(${170 + shade * 30},${175 + shade * 25},${180 + shade * 20})`;
      ctx.fillRect(x, doorTop, 2, doorH);
    }
  });
  ctx.restore();
}

function drawOffice(ctx, W, H, t) {
  ctx.fillStyle = '#0d1420';
  ctx.fillRect(0, 0, W, H);
  // Window
  const gwin = ctx.createLinearGradient(W * 0.6, 0, W, 0);
  gwin.addColorStop(0, 'transparent');
  gwin.addColorStop(1, 'rgba(91,141,238,0.12)');
  ctx.fillStyle = gwin;
  ctx.fillRect(W * 0.6, 0, W * 0.4, H * 0.6);
  // Desk
  ctx.fillStyle = '#1c2535';
  ctx.fillRect(W * 0.25, H * 0.58, W * 0.5, H * 0.1);
  // Monitor glow
  ctx.fillStyle = `rgba(91,141,238,${0.1 + 0.05 * Math.sin(t * 0.02)})`;
  ctx.fillRect(W * 0.38, H * 0.38, W * 0.24, H * 0.18);
  // Papers
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let i = 0; i < 4; i++) {
    ctx.fillRect(W * (0.28 + i * 0.06), H * 0.68, W * 0.04, H * 0.05);
  }
}

function drawToilet(ctx, W, H, t) {
  ctx.fillStyle = '#101820';
  ctx.fillRect(0, 0, W, H);
  // Fluorescent flicker
  const flicker = 0.7 + 0.3 * Math.abs(Math.sin(t * 0.08));
  const gf = ctx.createLinearGradient(0, 0, 0, H * 0.3);
  gf.addColorStop(0, `rgba(200,230,255,${0.12 * flicker})`);
  gf.addColorStop(1, 'transparent');
  ctx.fillStyle = gf;
  ctx.fillRect(0, 0, W, H * 0.3);
  // Mirror
  ctx.strokeStyle = 'rgba(200,220,255,0.2)';
  ctx.lineWidth = 1;
  ctx.strokeRect(W * 0.33, H * 0.12, W * 0.34, H * 0.35);
  ctx.fillStyle = `rgba(150,180,220,${0.06 + 0.03 * Math.sin(t * 0.01)})`;
  ctx.fillRect(W * 0.34, H * 0.13, W * 0.32, H * 0.33);
  // Cubicles
  ctx.fillStyle = '#1a2535';
  ctx.fillRect(W * 0.1, H * 0.5, W * 0.22, H * 0.45);
  ctx.fillRect(W * 0.38, H * 0.5, W * 0.22, H * 0.45);
  ctx.fillRect(W * 0.66, H * 0.5, W * 0.22, H * 0.45);
}

function drawMeeting(ctx, W, H, t) {
  ctx.fillStyle = '#0e1520';
  ctx.fillRect(0, 0, W, H);
  // Projector screen
  const gp = ctx.createLinearGradient(W * 0.2, H * 0.1, W * 0.8, H * 0.5);
  gp.addColorStop(0, 'rgba(91,141,238,0.15)');
  gp.addColorStop(1, 'rgba(91,141,238,0.05)');
  ctx.fillStyle = gp;
  ctx.fillRect(W * 0.2, H * 0.1, W * 0.6, H * 0.38);
  // Table
  ctx.fillStyle = '#1a2535';
  ctx.fillRect(W * 0.1, H * 0.58, W * 0.8, H * 0.12);
  // People silhouettes
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = 'rgba(30,40,60,0.8)';
    const bx = W * (0.15 + i * 0.16), by = H * 0.58;
    ctx.fillRect(bx - 10, by - 28, 20, 28);
    ctx.beginPath();
    ctx.arc(bx, by - 35, 12, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawKRRB(ctx, W, H, t) {
  ctx.fillStyle = '#080c18';
  ctx.fillRect(0, 0, W, H);
  // Big dark screen
  const gs = ctx.createLinearGradient(W * 0.05, H * 0.05, W * 0.95, H * 0.5);
  gs.addColorStop(0, `rgba(91,141,238,${0.08 + 0.03 * Math.sin(t * 0.015)})`);
  gs.addColorStop(1, `rgba(91,141,238,0.03)`);
  ctx.fillStyle = gs;
  ctx.fillRect(W * 0.08, H * 0.06, W * 0.84, H * 0.45);
  // Slide content hint
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  for (let i = 0; i < 3; i++) {
    ctx.fillRect(W * (0.15 + i * 0.25), H * 0.15, W * 0.18, H * 0.04);
  }
  // Long table
  ctx.fillStyle = '#141d30';
  ctx.fillRect(W * 0.05, H * 0.6, W * 0.9, H * 0.12);
  // Many silhouettes
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = `rgba(25,35,55,${0.6 + 0.1 * (i % 2)})`;
    const bx = W * (0.1 + i * 0.11);
    ctx.fillRect(bx - 8, H * 0.6 - 24, 16, 24);
    ctx.beginPath();
    ctx.arc(bx, H * 0.6 - 30, 9, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawEvening(ctx, W, H, t) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0a0812');
  bg.addColorStop(1, '#14101e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  drawCorridor(ctx, W, H, t);
  // Warmer, dimmer overlay
  const go = ctx.createLinearGradient(0, 0, 0, H);
  go.addColorStop(0, 'rgba(100,60,20,0.15)');
  go.addColorStop(1, 'rgba(80,40,10,0.08)');
  ctx.fillStyle = go;
  ctx.fillRect(0, 0, W, H);
  // Some lights off
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(W * 0.6, 0, W * 0.4, H * 0.45);
}

function drawMarat(ctx, W, H, t) {
  const x = W / 2;
  const y = H * 0.82;
  const bob = Math.sin(t * 0.05) * 2;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(x, y + 8, 22, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  ctx.fillStyle = '#1a1a2a';
  ctx.fillRect(x - 14, y - 52 + bob, 12, 55);
  ctx.fillRect(x + 2, y - 52 + bob, 12, 55);

  // Body - dark jacket
  ctx.fillStyle = '#1e2235';
  ctx.fillRect(x - 18, y - 88 + bob, 36, 42);

  // Shoulders
  ctx.fillRect(x - 20, y - 90 + bob, 6, 16);
  ctx.fillRect(x + 14, y - 90 + bob, 6, 16);

  // Left arm with phone
  ctx.fillStyle = '#1e2235';
  ctx.fillRect(x - 26, y - 78 + bob, 8, 32);
  // Phone
  ctx.fillStyle = '#2a2a3a';
  ctx.fillRect(x - 28, y - 58 + bob, 12, 18);
  ctx.fillStyle = `rgba(91,141,238,${0.4 + 0.3 * Math.sin(t * 0.08)})`;
  ctx.fillRect(x - 27, y - 57 + bob, 10, 16);

  // Right arm with folder
  ctx.fillStyle = '#1e2235';
  ctx.fillRect(x + 18, y - 76 + bob, 8, 30);
  // Folder
  ctx.fillStyle = '#2a3545';
  ctx.fillRect(x + 16, y - 76 + bob, 18, 22);
  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  ctx.fillRect(x + 18, y - 74 + bob, 14, 2);
  ctx.fillRect(x + 18, y - 70 + bob, 14, 2);

  // Badge lanyard
  ctx.strokeStyle = 'rgba(232,184,75,0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - 4, y - 88 + bob);
  ctx.lineTo(x - 4, y - 70 + bob);
  ctx.stroke();
  // Badge
  ctx.fillStyle = 'rgba(232,184,75,0.8)';
  ctx.fillRect(x - 8, y - 70 + bob, 10, 7);

  // Head (back)
  ctx.fillStyle = '#2a2015';
  ctx.beginPath();
  ctx.ellipse(x, y - 96 + bob, 14, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  // Hair
  ctx.fillStyle = '#1a1208';
  ctx.fillRect(x - 14, y - 112 + bob, 28, 10);
}

// ANIMATION LOOP
// ═══════════════════════════════════════════════
let animT = 0;
let currentScene = 'title';
let animRunning = true;

let _rafId = null;
function animate() {
  if (!animRunning) return;
  if (document.hidden) {
    _rafId = requestAnimationFrame(animate);
    return;
  }
  animT++;
  const titleEl = document.getElementById('title-screen');
  if (titleEl && titleEl.style.display !== 'none') {
    drawScene('title-canvas', 'title', animT);
  }
  const gameEl = document.getElementById('game');
  if (gameEl && gameEl.style.display !== 'none') {
    drawScene('game-canvas', currentScene, animT);
  }
  _rafId = requestAnimationFrame(animate);
}

// Pause/resume when switching tabs
document.addEventListener('visibilitychange', function() {
  if (!document.hidden && animRunning) {
    if (_rafId) cancelAnimationFrame(_rafId);
    _rafId = requestAnimationFrame(animate);
  }
});

// Стартуем анимацию только когда DOM готов — критично для Safari при file://
ready(function() {
  animate();
});

function updateStats() {
  document.getElementById('bar-respect').style.width = state.respect + '%';
  document.getElementById('bar-calm').style.width   = state.calm    + '%';
  document.getElementById('pct-respect').textContent = state.respect + '%';
  document.getElementById('pct-calm').textContent    = state.calm    + '%';
  document.getElementById('game-time').textContent   = state.time;
  document.getElementById('chapter-label').textContent = state.chapter;
}

function showStatPopup(text) {
  const el = document.getElementById('stat-popup');
  el.textContent = text;
  el.className = 'stat-popup show';
  setTimeout(() => el.className = 'stat-popup', 2100);
}

// Таймеры дельта-попапов в HUD
const _deltaTimers = {};

function changeStat(key, delta) {
  state[key] = Math.min(100, Math.max(0, state[key] + delta));
  updateStats();
  // Показываем дельту рядом с баром
  const elId = 'delta-' + key;
  const el = document.getElementById(elId);
  if (el) {
    const sign = delta > 0 ? '+' : '';
    el.textContent = sign + delta + '%';
    el.className = 'stat-delta visible ' + (delta > 0 ? 'pos' : 'neg');
    clearTimeout(_deltaTimers[key]);
    _deltaTimers[key] = setTimeout(() => {
      el.classList.remove('visible');
    }, 2200);
  }
}

function setTime(t) { state.time = t; updateStats(); }
function setChapter(c) { state.chapter = c; updateStats(); }

function showToast(msg, dur = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function showChapterTitle(num, name, cb) {
  const ov = document.getElementById('chapter-overlay');
  document.getElementById('chapter-num-text').textContent = 'ГЛАВА ' + num;
  document.getElementById('chapter-name-text').textContent = name;
  ov.classList.add('show');
  setTimeout(() => {
    ov.classList.remove('show');
    if (cb) cb();
  }, 1800);
}

function setNarrative(speaker, text) {
  document.getElementById('narrative-speaker').textContent = speaker || '';
  document.getElementById('narrative-text').innerHTML = text;
}

function setLocation(label, scene) {
  document.getElementById('location-label').textContent = label;
  currentScene = scene;
  const photo = document.getElementById('scene-photo');
  const canvas = document.getElementById('game-canvas');
  if (photo && canvas) {
    const imgEl = SCENE_PHOTOS[scene] || null;
    if (imgEl) {
      photo.src = imgEl.src;
      photo.style.display = 'block';
      canvas.style.opacity = '0';
    } else {
      photo.style.display = 'none';
      photo.src = '';
      canvas.style.opacity = '1';
    }
  }
}

function clearChoices() {
  document.getElementById('choices-area').innerHTML = '';
  document.getElementById('nav-arrows').style.display = 'none';
}

function addChoice(icon, text, cb) {
  state.choices++;
  const btn = document.createElement('button');
  btn.className = 'choice-btn';
  btn.innerHTML = `<span class="choice-arrow">${icon}</span><span>${text}</span>`;
  btn.onclick = () => {
    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
    setTimeout(cb, 180);
  };
  document.getElementById('choices-area').appendChild(btn);
}

function showNavArrows(config) {
  // config: { up, left, right, center } each { label, cb } or null
  const nav = document.getElementById('nav-arrows');
  nav.style.display = 'grid';
  ['up','left','right','center'].forEach(dir => {
    const btn = document.getElementById('nav-' + dir);
    const lbl = document.getElementById('nav-' + dir + '-label');
    if (config[dir]) {
      btn.classList.remove('disabled');
      btn.disabled = false;
      if (lbl) lbl.textContent = config[dir].label;
      btn.onclick = () => {
        nav.querySelectorAll('.nav-btn').forEach(b => b.disabled = true);
        setTimeout(config[dir].cb, 180);
      };
    } else {
      btn.classList.add('disabled');
      btn.disabled = false;
    }
  });
}

function transitionTo(fn) {
  const panel = document.getElementById('scene-panel');
  const narr = document.getElementById('narrative-box');
  panel.classList.add('fading');
  narr.classList.add('fading');
  clearChoices();
  setTimeout(() => {
    panel.classList.remove('fading');
    narr.classList.remove('fading');
    fn();
  }, 260);
}

function togglePhone() {
  const ov = document.getElementById('phone-overlay');
  state.phoneOpen = !state.phoneOpen;
  if (state.phoneOpen) {
    ov.classList.add('show');
    document.getElementById('phone-notif').style.display = 'none';
  } else {
    ov.classList.remove('show');
  }
}

function setupPhone() {
  const cont = document.getElementById('phone-msgs');
  cont.innerHTML = '';
  phoneMessages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'phone-msg';
    div.innerHTML = `<div class="phone-sender">${m.sender}</div>${m.text}`;
    cont.appendChild(div);
  });
}

// Attach start button
ready(function() {

  if (!btn) return;
  btn.addEventListener('touchstart', function(e) {

    if (window.Music) window.Music.tryStart();
  }, { passive: true });
  btn.addEventListener('touchend', function(e) {

document.addEventListener('keydown', e => {
  const navMap = {
    'ArrowUp': 'nav-up', 'ArrowLeft': 'nav-left',

  };
  const btnId = navMap[e.key];

});

// ═══════════════════════════════════════════════
// 8-BIT MUSIC ENGINE (Web Audio API)
// ═══════════════════════════════════════════════

const Music = (() => {
  let ctx = null, playing = false, scheduledNodes = [], loopTimeout = null;
  let muteBtn = null, muted = false;

  // Ноты в Гц
  const N = {
    C3:131,D3:147,E3:165,F3:175,G3:196,A3:220,B3:247,
    C4:262,D4:294,E4:330,F4:349,G4:392,A4:440,B4:494,
    C5:523,D5:587,E5:659,F5:698,G5:784,A5:880,B5:988,
    C6:1047,D6:1175,E6:1319,_:0
  };

  const BPM = 148;
  const BEAT = 60 / BPM;       // длительность четверти в секундах
  const S = BEAT / 2;          // восьмая
  const T = BEAT / 4;          // шестнадцатая

  // ── Мелодия (lead): [нота, длительность]
  const melody = [
    [N.E5,S],[N.E5,S],[N._,S],[N.E5,S],  [N._,S],[N.C5,S],[N.E5,S],[N._,S],
    [N.G5,BEAT],[N._,BEAT],[N.G4,BEAT],[N._,BEAT],

    [N.C5,S+T],[N._,T],[N.G4,S+T],[N._,T],[N.E4,S+T],[N._,T],
    [N.A4,S],[N._,S],[N.B4,S],[N._,S],[N.A4,S],[N._,S],
    [N.G4,S*0.67],[N.E5,S*0.67],[N.G5,S*0.67],[N.A5,S],[N._,S],[N.F5,S],[N.G5,S],
    [N.E5,S],[N._,S],[N.C5,S],[N.D5,S],[N.B4,S],[N._,S],

    // повтор A
    [N.E5,S],[N.E5,S],[N._,S],[N.E5,S],  [N._,S],[N.C5,S],[N.E5,S],[N._,S],
    [N.G5,BEAT],[N._,BEAT],[N.G4,BEAT],[N._,BEAT],

    // Bridge
    [N.C5,S+T],[N._,T],[N.G4,S+T],[N._,T],[N.E4,S+T],[N._,T],
    [N.A4,S],[N._,S],[N.B4,S],[N._,S],[N.A4,S],[N._,S],
    [N.G4,S*0.67],[N.E5,S*0.67],[N.G5,S*0.67],[N.A5,S],[N._,S],[N.F5,S],[N.G5,S],
    [N.E5,S],[N._,S],[N.C5,S],[N.D5,S],[N.B4,S],[N._,S],
  ];

  // ── Бас: [нота, длительность]
  const bass = [
    [N.C3,BEAT],[N.C3,BEAT],[N.G3,BEAT],[N.G3,BEAT],
    [N.A3,BEAT],[N.A3,BEAT],[N.F3,BEAT],[N.F3,BEAT],
    [N.C3,BEAT],[N.C3,BEAT],[N.G3,BEAT],[N.G3,BEAT],
    [N.A3,BEAT],[N.A3,BEAT],[N.E3,BEAT],[N.E3,BEAT],

    [N.C3,BEAT],[N.C3,BEAT],[N.G3,BEAT],[N.G3,BEAT],
    [N.A3,BEAT],[N.A3,BEAT],[N.F3,BEAT],[N.F3,BEAT],
    [N.C3,BEAT],[N.G3,BEAT],[N.A3,BEAT],[N.F3,BEAT],
    [N.C3,BEAT],[N.C3,BEAT],[N.C3,BEAT],[N.C3,BEAT],
  ];

  // ── Арпеджио (пульсирующий фон)
  const arp = [
    N.C4,N.E4,N.G4,N.E4,  N.C4,N.E4,N.G4,N.E4,
    N.G3,N.B3,N.D4,N.B3,  N.G3,N.B3,N.D4,N.B3,
    N.A3,N.C4,N.E4,N.C4,  N.A3,N.C4,N.E4,N.C4,
    N.F3,N.A3,N.C4,N.A3,  N.F3,N.A3,N.C4,N.A3,
  ];

  // AudioContext создаётся прямо в tryStart() внутри жеста

  // ── Генератор одного звука
  function playNote(freq, startTime, duration, type, gainVal, pan) {
    if (!ctx || muted || freq === 0) return null;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;

    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);

    // Огибающая: быстрая атака, затухание
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(gainVal, startTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(gainVal * 0.7, startTime + duration * 0.5);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

    osc.connect(gain);
    if (panner) {
      panner.pan.setValueAtTime(pan || 0, startTime);
      gain.connect(panner);
      panner.connect(ctx.destination);
    } else {
      gain.connect(ctx.destination);
    }

    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
    scheduledNodes.push(osc);
    return osc;
  }

  // ── Перкуссия (шум через буфер)
  function playDrum(startTime, type) {
    if (!ctx || muted) return;
    const bufLen = ctx.sampleRate * 0.08;
    const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;

    const src = ctx.createBufferSource();
    src.buffer = buf;
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();

    if (type === 'kick') {
      filter.type = 'lowpass'; filter.frequency.value = 180;
      gain.gain.setValueAtTime(1.2, startTime);
    } else {
      filter.type = 'highpass'; filter.frequency.value = 5000;
      gain.gain.setValueAtTime(0.35, startTime);
    }
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.08);

    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    src.start(startTime);
    scheduledNodes.push(src);
  }

  // ── Расчёт полной длины одного цикла
  function loopDuration() {
    return melody.reduce((s, n) => s + n[1], 0);
  }

  // ── Запуск одного прохода
  function scheduleLoop(startTime) {
    let t = startTime;

    // Мелодия — квадратная волна (lead), лёгкое пространство справа
    for (const [freq, dur] of melody) {
      if (freq) playNote(freq, t, dur * 0.85, 'square', 0.18, 0.15);
      t += dur;
    }

    // Бас — треугольная волна, слева
    t = startTime;
    for (const [freq, dur] of bass) {
      if (freq) playNote(freq, t, dur * 0.9, 'triangle', 0.22, -0.3);
      t += dur;
    }

    // Арпеджио — пила, очень тихо, по центру
    t = startTime;
    const totalBeats = loopDuration();
    const arpStep = totalBeats / arp.length;
    for (let i = 0; i < arp.length; i++) {
      if (arp[i]) playNote(arp[i], t + i * arpStep, arpStep * 0.55, 'sawtooth', 0.07, 0);
    }

    // Перкуссия — на каждый бит
    t = startTime;
    const totalBeats2 = loopDuration();
    const kickPositions = [0, BEAT*2, BEAT*4, BEAT*6, BEAT*8, BEAT*10, BEAT*12, BEAT*14];
    const hihatStep = S;
    for (let i = 0; i * hihatStep < totalBeats2; i++) {
      playDrum(t + i * hihatStep, 'hihat');
    }
    for (const kp of kickPositions) {
      if (kp < totalBeats2) playDrum(t + kp, 'kick');
    }
  }

  function startLoop() {
    if (!ctx) return;
    const dur = loopDuration();
    scheduleLoop(ctx.currentTime + 0.1);

    function reschedule() {
      if (!playing) return;
      // Чистим старые ноды
      scheduledNodes = scheduledNodes.filter(n => { try { return n.playbackState !== 3; } catch(e) { return true; } });
      scheduleLoop(ctx.currentTime + 0.1);
      loopTimeout = setTimeout(reschedule, dur * 1000);
    }
    loopTimeout = setTimeout(reschedule, dur * 1000);
  }

  function stop() {
    playing = false;
    clearTimeout(loopTimeout);
    scheduledNodes.forEach(n => { try { n.stop(); } catch(e) {} });
    scheduledNodes = [];
  }



  function createMuteButton() {
    muteBtn = document.createElement('button');
    muteBtn.id = 'music-btn';
    muteBtn.textContent = '🎵';
    muteBtn.setAttribute('aria-label', 'Музыка вкл/выкл');
    // Применяем стили по одному — cssText с display:flex ненадёжен в Safari
    var bs = muteBtn.style;
    bs.position = 'fixed';
    bs.top = '0.6rem';
    bs.right = '0.6rem';
    bs.zIndex = '9999';
    bs.background = 'rgba(30,34,50,0.85)';
    bs.border = '1px solid rgba(255,255,255,0.15)';
    bs.borderRadius = '50%';
    bs.width = '2.6rem';
    bs.height = '2.6rem';
    bs.fontSize = '1.1rem';
    bs.cursor = 'pointer';
    bs.display = '-webkit-flex';
    bs.display = 'flex';
    bs.webkitAlignItems = 'center';
    bs.alignItems = 'center';
    bs.webkitJustifyContent = 'center';
    bs.justifyContent = 'center';
    bs.webkitTapHighlightColor = 'transparent';
    bs.lineHeight = '1';
    bs.padding = '0';
    bs.boxSizing = 'border-box';
    muteBtn.addEventListener('touchstart', function(e){
      e.preventDefault();
      toggleMute();
    }, { passive: false });
    muteBtn.addEventListener('click', function(e) {
      // click — для десктопа
      toggleMute();
    });
    document.body.appendChild(muteBtn);
  }

  function tryStart() {
    if (playing || muted) return;
    // Создаём контекст прямо здесь — мы внутри жеста пользователя
    if (!ctx) {
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) { return; }
    }
    if (ctx.state === 'suspended') {
      ctx.resume().then(function() {
        if (!playing) { playing = true; startLoop(); }
      });
    } else {
      if (!playing) { playing = true; startLoop(); }
    }
  }

  ready(function() {
    createMuteButton();
    // Музыкальная кнопка уже умеет включать/выключать через toggleMute
    // Дополнительно: запускаем музыку при нажатии кнопки Начать игру
    var startBtn = document.getElementById('start-btn');
    if (startBtn) {
      startBtn.addEventListener('touchstart', function() {
        tryStart();
      }, { passive: true });
      startBtn.addEventListener('mousedown', function() {
        tryStart();
      });
    }
    // Кнопка музыки тоже запускает через tryStart
    if (muteBtn) {
      muteBtn.addEventListener('touchstart', function() {
        if (!muted) tryStart();
      }, { passive: true });
    }
  });

  // toggleMute тоже использует tryStart
  function toggleMute() {
    muted = !muted;
    if (muteBtn) muteBtn.textContent = muted ? '🔇' : '🎵';
    if (muted) { stop(); playing = false; }
    else tryStart();
  }

  return { tryStart, stop, toggleMute };
})();
window.Music = Music;

</script>
